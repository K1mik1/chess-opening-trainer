<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Trainer</title>
<meta name="theme-color" content="#262019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scacchi">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=17">
</head>
<body>
<canvas id="confetti"></canvas>

<header id="topbar">
  <button class="header-welcome" data-nav="home" aria-label="Torna alla Home"><span id="greeting"></span><small>Pronto ad allenarti?</small></button>
  <div class="header-progress" title="Repertorio di aperture padroneggiato"><b id="ringPct">0%</b><small>repertorio</small></div>
  <button id="muteBtn" class="icon-btn" title="Sound on/off">🔊</button>
</header>

<main id="app"><!-- views injected here --></main>

<!-- ====== HOME VIEW TEMPLATE ====== -->
<template id="tpl-home">
  <section class="view home">
    <div id="homeMenus"></div>
    <details id="homeSettings"><summary>Aspetto e impostazioni</summary><div id="badgeRow" class="badge-row"></div></details>
  </section>
</template>
<template id="tpl-openings">
  <section class="view openings">
    <button class="back" data-nav="home">‹ Home</button>
    <h1>Aperture</h1>
    <p class="muted">Teoria, lezioni e allenamento del tuo repertorio.</p>
    <button id="startBtn" class="big-btn">▶ Start today's training</button>
    <div id="dueSummary" class="due-summary"></div>

    <h2 class="section-title">Your repertoire</h2>
    <div id="courseGrid" class="course-grid"></div>

  </section>
</template>

<!-- ====== TRAINER VIEW TEMPLATE ====== -->
<template id="tpl-train">
  <section class="view train">
    <div class="train-head">
      <button class="back" data-nav="home">‹ Back</button>
      <div class="train-progress"><div id="sessBarFill"></div></div>
      <div id="sessCount" class="muted"></div>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>
      <div id="boardOverlay" class="board-overlay"></div>
    </div>

    <div class="train-info">
      <div class="line-name" id="lineName">—</div>
      <div class="line-sub" id="lineSub"></div>
      <div id="planCard" class="plan-card" hidden>
        <div class="plan-kicker">PIANO DELLA POSIZIONE</div>
        <div id="planGoal" class="plan-goal"></div>
        <p id="planText"></p>
        <div class="plan-grid"><div><span>IDEA</span><b id="planIdea"></b></div><div><span>EVITA</span><b id="planAvoid"></b></div></div>
        <a id="planSource" class="plan-source" target="_blank" rel="noopener">Fonte teorica ↗</a>
      </div>
      <div id="conceptPanel" class="concept-panel" hidden>
        <div class="concept-kicker">PRIMA DI GIOCARE</div>
        <div id="conceptQuestion" class="concept-question"></div>
        <div id="conceptOptions" class="concept-options"></div>
        <div id="conceptFeedback" class="concept-feedback"></div>
      </div>
      <div class="turn-prompt" id="turnPrompt"></div>
      <div class="moves" id="moveList"></div>
      <div class="train-actions">
        <button id="hintBtn" class="ghost-btn">💡 Hint</button>
        <span id="puzzleHistory" hidden><button id="prevMove" class="ghost-btn" aria-label="Mossa precedente">‹ Indietro</button><button id="nextMove" class="ghost-btn" aria-label="Mossa successiva">Avanti ›</button></span>
        <button id="revealBtn" class="ghost-btn">I forgot — show me</button>
      </div>
    </div>
  </section>
</template>

<!-- ====== COURSE DETAIL TEMPLATE ====== -->
<template id="tpl-course">
  <section class="view course-detail">
    <button class="back" data-nav="openings">‹ Aperture</button>
    <h1 id="cdName"></h1>
    <p id="cdSummary" class="muted summary"></p>
    <div class="cd-actions">
      <button id="cdDrill" class="big-btn small">▶ Drill this opening</button>
      <button id="cdLearn" class="ghost-btn">📖 Learn mode (show moves)</button>
    </div>
    <h2 class="section-title">Variations</h2>
    <div id="cdLines" class="cd-lines"></div>
  </section>
</template>

<!-- ====== LESSON TEMPLATE ====== -->
<template id="tpl-lesson">
  <section class="view lesson-detail">
    <button class="back" data-nav="openings">‹ Aperture</button>
    <span class="ls-kicker">Lesson</span>
    <h1 id="lsTitle"></h1>
    <p id="lsDiag" class="ls-diag"></p>
    <div class="cd-actions">
      <button id="lsDrill" class="big-btn small">▶ Practise this lesson</button>
    </div>
    <div id="lsBody"></div>
  </section>
</template>

<!-- ====== COACH / WEAKNESS REPORT TEMPLATE ====== -->
<template id="tpl-coach">
  <section class="view coach">
    <button class="back" data-nav="home">‹ Back</button>
    <h1>How you've been playing</h1>
    <p class="muted summary">Read straight off your real chess.com games by Stockfish.
      Everything you practise is chosen from this.</p>
    <div id="coachBody"></div>
  </section>
</template>

<!-- ====== SESSION SUMMARY TEMPLATE ====== -->
<template id="tpl-summary">
  <div class="modal-back" id="summaryModal">
    <div class="modal">
      <h1 id="sumTitle">Session complete!</h1>
      <div class="sum-stats">
        <div class="sum-stat"><b id="sumLines">0</b><span>lines</span></div>
        <div class="sum-stat"><b id="sumAcc">0%</b><span>accuracy</span></div>
        <div class="sum-stat"><b id="sumXp">+0</b><span>XP</span></div>
        <div class="sum-stat"><b id="sumStreak">0</b><span>🔥 streak</span></div>
      </div>
      <p id="sumNext" class="muted"></p>
      <button class="big-btn" data-nav="home">Done</button>
    </div>
  </div>
</template>

<div id="toastHost"></div>

<script src="repertoire.js"></script>
<!-- Generated from your chess.com games. Optional: if these two are absent the
     app still runs as a pure opening trainer. coach.js must load before app.js,
     which calls into it during the first render. -->
<script src="exercises.js"></script>
<script src="public-puzzles.js?v=9"></script>
<script src="coach.js?v=15"></script>
<script src="puzzles-ui.js?v=17"></script>
<script src="books.js?v=1"></script>
<script src="pieceset.js?v=1"></script>
<script src="app.js?v=15"></script>
<script src="pwa.js?v=4"></script>
</body>
</html>
